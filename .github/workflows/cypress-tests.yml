name: 🧪 Cypress API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cypress-tests:
    name: Rodar Testes de API com Cypress
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🧪 Rodar testes Cypress
        run: npm test

      - name: ✅ Testes concluídos com sucesso!
        if: success()
        run: echo "Todos os testes passaram!"

      - name: ❌ Testes falharam
        if: failure()
        run: echo "Alguns testes falharam. Verifique os logs acima."
